<!DOCTYPE html>
<html lang="id">

<style>

*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}

.card{background:linear-gradient(180deg,var(--pan2),var(--pan));border:1px solid var(--line);border-radius:18px;padding:20px;position:relative;display:flex;flex-direction:column;gap:10px}

.tag{position:absolute;top:-11px;right:16px;background:var(--g);padding:3px 12px;border-radius:99px;font-size:12px;font-weight:600}
.card ul{list-style:none;padding:0;display:grid;gap:5px;font-size:15px;color:#d7d4ee;flex:1}

label{font-size:13px;color:var(--mut);display:block;margin:8px 0 4px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(8,6,18,.88);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
nav div{max-width:560px;margin:0 auto;display:flex;justify-content:space-around;gap:4px}
nav button{flex:1;background:0;border:0;color:var(--mut);display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:12px;cursor:pointer;border-radius:12px;position:relative}
nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:#fff}nav button.on:after{content:"";position:absolute;top:-9px;width:28px;height:3px;border-radius:3px;background:var(--g)}
#tabAdm{display:none}#tabAdm.show{display:grid}
.ov{position:fixed;inset:0;background:rgba(3,2,10,.75);backdrop-filter:blur(6px);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.md{background:var(--pan);border:1px solid var(--line);border-radius:20px;padding:24px;width:100%;max-width:440px;max-height:90vh;overflow:auto;animation:pop .22s}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-90px);background:#fff;color:#0a0818;padding:11px 20px;border-radius:12px;z-index:99;transition:.3s;font-weight:500}.toast.on{transform:translate(-50%,0)}
.sum{background:#0a0817;border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--line)}td input{padding:7px 10px;min-height:36px}
.mini{padding:6px 12px;border-radius:9px;font-size:13px;background:rgba(255,93,115,.14);color:var(--bad);border:0;cursor:pointer}
.prev{border:1px dashed var(--vio);border-radius:14px;padding:18px;text-align:center;margin-top:8px;font-family:Unbounded,sans-serif;font-weight:500;overflow-wrap:anywhere}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;margin:8px 0}.sw input{width:20px;min-height:20px;accent-color:var(--vio)}
@media(prefers-reduced-motion:reduce){.orb:before{animation:none}*{transition:none!important}}
</style>
</head>

async get(k,sh=true){try{if(hasWS){const r=await window.storage.get(k,sh);return r?JSON.parse(r.value):null}const v=localStorage.getItem((sh?'s_':'p_')+k);return v?JSON.parse(v):null}catch(e){return mem[(sh?'s_':'p_')+k]??null}},

async list(pre){try{if(hasWS){const r=await window.storage.list(pre,true);return r?r.keys:[]}return Object.keys(localStorage).filter(k=>k.startsWith('s_'+pre)).map(k=>k.slice(2))}catch(e){return Object.keys(mem).filter(k=>k.startsWith('s_'+pre)).map(k=>k.slice(2))}}};

function setA(i,v){$('#'+i).value=v;upd()}
function bCard(p){return`<div class="card ${p.hl?'hl':''}">${p.tag?`<span class="tag">${p.tag}</span>`:''}<h3>${p.n}</h3><ul>${p.i.map(x=>`<li>${x}</li>`).join('')}</ul><div class="price">${ph(pay(p.id,1))}</div><button class="btn w" onclick="buy('${p.id}',1)">Beli sekarang</button></div>`}
function amtCard(k,inp,label,chips){const u=pr(k);return`<div class="card"><h3>${label}</h3><p>Tentukan jumlah sendiri. Harga menyesuaikan otomatis.</p><label>Jumlah ${label} (maks ${(u.m*u.u).toLocaleString('id-ID')})</label><div class="qty"><button onclick="step('${inp}',-1,${u.u})">−</button><input type="number" id="${inp}" min="${u.u}" max="${u.m*u.u}" step="${u.u}" value="${chips[0]}" oninput="upd()"><button onclick="step('${inp}',1,${u.u})">+</button></div><div class="chips">${chips.map(c=>`<button onclick="setA('${inp}',${c})">${c.toLocaleString('id-ID')}</button>`).join('')}</div><div class="price" id="${k==='money'?'pm':'ps'}"></div><button class="btn w" onclick="buy('${k}',qOf('${k}'))">Beli ${label}</button></div>`}
function renderStore(){const L=[['b','Bundling'],['t','Money & Shards'],['k','Key'],['r','Rank']];let h=`<h2>Store Oblivion</h2><p class="sub">Paket bundling lebih hemat daripada beli satuan.</p>
<div class="tabs">${L.map(([k,n])=>`<button class="${T===k?'on':''}" onclick="T='${k}';renderStore()">${n}</button>`).join('')}</div>
<div class="vbar"><input id="vc" placeholder="Kode voucher" value="${V?esc(V.c):''}"><button class="btn" onclick="applyV()">Pakai</button>${V?'<button class="btn" onclick="V=null;renderStore()">Hapus</button>':''}</div><div class="grid">`;
if(T==='b')h+=PR.filter(p=>p.c==='b').map(p=>bCard(pr(p.id))).join('');
if(T==='r')h+=PR.filter(p=>p.c==='r').map(p=>{const x=pr(p.id);return`<div class="card"><h3>${x.n}</h3><p>Beli satuan. Paket bundling memberi lebih banyak untuk harga yang sama.</p><div class="price">${ph(pay(x.id,1))}</div><button class="btn w" onclick="buy('${x.id}',1)">Beli rank</button></div>`}).join('');
if(T==='t')h+=amtCard('money','mA','Money',[50000,100000,250000])+amtCard('shard','sA','Shards',[1000,2500,5000]);
if(T==='k')h+=`<div class="card"><h3>Key</h3><p>Pilih jenis key dan jumlahnya.</p><label>Jenis key</label><select id="ks" onchange="S.k=this.value;upd()">${PR.filter(p=>p.c==='k').map(p=>`<option value="${p.id}" ${S.k===p.id?'selected':''}>${p.n} – ${fmt(pr(p.id).p)}</option>`).join('')}</select><label>Jumlah</label><div class="qty"><button onclick="step('kq',-1,1)">−</button><input type="number" id="kq" min="1" max="64" value="1" oninput="upd()"><button onclick="step('kq',1,1)">+</button></div><div class="price" id="pk"></div><button class="btn w" onclick="buy($('#ks').value,qOf('key'))">Beli key</button></div>`;
$('#s-store').innerHTML=h+'</div>';if(T==='t'||T==='k'){if(T==='t'){}if(T==='k'){}}
if(T==='t'){$('#pm').innerHTML='';$('#ps').innerHTML='';const f=()=>{$('#pm').innerHTML=ph(pay('money',qOf('money')));$('#ps').innerHTML=ph(pay('shard',qOf('shard')))};f();window.upd=function(){f()}}
else if(T==='k'){window.upd=function(){const id=$('#ks').value;$('#pk').innerHTML=ph(pay(id,qOf('key')))};upd()}}
function applyV(){const c=$('#vc').value.trim().toUpperCase();if(!c)return;const v=C.v.find(x=>x.c&&x.c.toUpperCase()===c);if(!v)return toast('Kode voucher tidak ditemukan');if(!valid(v))return toast('Kode voucher sudah kedaluwarsa');V=v;renderStore();toast(`Voucher ${v.c} aktif: diskon ${v.p}%`)}

/* checkout */
function buy(id,q){cur={id,q};const p=pr(id);
modal(`<h2>Checkout</h2><div class="sum"><b>${p.n}${p.u?' '+(q*p.u).toLocaleString('id-ID'):''}</b>${p.c==='k'?` × ${q}`:''}<div class="price" id="cp">${ph(pay(id,q))}</div></div>
<form id="cf"><label>Nickname Minecraft</label><input name="name" required maxlength="16" autocomplete="off" oninput="U=this.value.trim();$('#cp').innerHTML=ph(pay(cur.id,cur.q))"><label>Email</label><input type="email" name="email" required><div class="row"><button class="btn" type="button" onclick="closeM()">Batal</button><button class="btn w" type="submit">Lanjut ke WhatsApp</button></div></form>`);
$('#cf').onsubmit=e=>{e.preventDefault();const f=e.target,[b,fi,d]=pay(cur.id,cur.q);
const nama=p.n+(p.u?' '+(cur.q*p.u).toLocaleString('id-ID'):'')+(p.c==='k'?' x'+cur.q:'');
const msg=`Halo min, aku ingin membeli produk ini:\n\nProduk: ${nama}\n\nNickname MC: ${f.elements['name'].value.trim()}\nEmail: ${f.email.value.trim()}\nTotal harga: ${fmt(fi)}${d?` (harga asli ${fmt(b)}, diskon ${d}%)`:''}\nVoucher: ${V?V.c:'-'}`;
const url='https://wa.me/6289576623406?text='+encodeURIComponent(msg);
if(!window.open(url,'_blank'))location.href=url;closeM();toast('Membuka WhatsApp...')}}
/* sosial */
function renderSocial(){const L=[{t:'discord',u:C.dc},{t:'whatsapp',u:C.wa},...C.soc.filter(s=>s.u)],N={youtube:'YouTube',tiktok:'TikTok',instagram:'Instagram',facebook:'Facebook',x:'X',discord:'Discord',whatsapp:'WhatsApp',link:'Website'};
$('#s-social').innerHTML=`<h2>Media Sosial</h2><p class="sub">Ikuti kami untuk info event, update, dan giveaway.</p><div class="grid">${L.map(s=>`<a class="card" style="text-decoration:none;color:inherit;flex-direction:row;align-items:center;gap:14px" href="${esc(s.u)}" target="_blank" rel="noopener"><span class="btn" style="padding:10px">${ic(s.t)}</span><b>${N[s.t]}</b></a>`).join('')}</div>`}

/* akun */
/* admin */
const sv=()=>{save();renderHome();renderStore();renderSocial()};
function renderAdm(){const L=[['srv','Server'],['hrg','Harga'],['vc','Voucher'],['mb','Member'],['sc','Sosial'],['bk','Backup']];
let h=`<h2>Admin Panel</h2><div class="tabs">${L.map(([k,n])=>`<button class="${AT===k?'on':''}" onclick="AT='${k}';renderAdm()">${n}</button>`).join('')}</div><div class="card">`;
if(AT==='srv')h+=`<label class="sw"><input type="checkbox" ${C.online?'checked':''} onchange="C.online=this.checked;sv()">Server online</label><label>IP</label><input value="${esc(C.ip)}" onchange="C.ip=this.value;sv()"><label>Port</label><input value="${esc(C.port)}" onchange="C.port=this.value;sv()"><label>Link Discord</label><input value="${esc(C.dc)}" onchange="C.dc=this.value;sv()"><label>Link WhatsApp</label><input value="${esc(C.wa)}" onchange="C.wa=this.value;sv()"><label>Slogan</label><textarea id="sg" rows="2" oninput="C.slogan=this.value;fit($('#sp'),this.value||' ')" onchange="sv()">${esc(C.slogan)}</textarea><label>Preview (ukuran mengikuti panjang teks)</label><div class="prev" id="sp"></div>`;
if(AT==='hrg')h+=`<div style="overflow-x:auto"><table><tr><th>Produk</th><th>Harga</th><th>Limit</th></tr>${PR.map(p=>{const x=pr(p.id);return`<tr><td>${x.n}${x.u?`<br><small class="sub">per ${x.u.toLocaleString('id-ID')}</small>`:''}</td><td><input type="number" min="0" value="${x.p}" onchange="C.o['${p.id}']={...C.o['${p.id}'],p:+this.value};sv()"></td><td><input type="number" min="1" value="${x.m}" onchange="C.o['${p.id}']={...C.o['${p.id}'],m:+this.value};sv()"></td></tr>`}).join('')}</table></div><p class="sub">Limit = jumlah maksimal per pembelian (Money/Shards dihitung per satuan).</p>`;
if(AT==='vc')h+=`<label>Kode voucher (kosongkan = diskon otomatis pada produk)</label><input id="vcode" style="text-transform:uppercase"><label>Diskon (%)</label><input id="vp" type="number" min="1" max="95" value="10"><label>Berlaku untuk</label><select id="vt"><option value="all">Semua produk</option>${PR.map(p=>`<option value="${p.id}">${p.n}</option>`).join('')}</select><label>Kedaluwarsa (kosong = tanpa batas)</label><input id="ve" type="date"><div class="row"><button class="btn w" onclick="addV()">Buat voucher</button></div><table style="margin-top:14px">${C.v.map((v,i)=>`<tr><td><b>${v.c?esc(v.c):'Otomatis'}</b><br><small class="sub">${v.p}% · ${v.t==='all'?'Semua':pr(v.t).n} · ${v.e||'tanpa batas'}${valid(v)?'':' · kedaluwarsa'}</small></td><td><button class="mini" onclick="C.v.splice(${i},1);save();renderAdm()">Hapus</button></td></tr>`).join('')}</table>`;
if(AT==='mb')h+=`<p class="sub">Diskon permanen untuk pemain tertentu. Aktif otomatis saat nickname itu diketik di checkout.</p><label>Nickname</label><input id="mn"><label>Nama rank khusus</label><input id="mr" placeholder="Contoh: Loyal Legend"><label>Diskon (%)</label><input id="md2" type="number" min="0" max="95" value="10"><div class="row"><button class="btn w" onclick="addM()">Simpan member</button></div><table style="margin-top:14px">${C.m.map((m,i)=>`<tr><td><b>${esc(m.n)}</b><br><small class="sub">${esc(m.r)} · ${m.d}%</small></td><td><button class="mini" onclick="C.m.splice(${i},1);save();renderAdm()">Hapus</button></td></tr>`).join('')}</table>`;
if(AT==='sc')h+=C.soc.map((s,i)=>`<div class="qty" style="margin-bottom:8px"><select style="width:130px;flex:none" onchange="C.soc[${i}].t=this.value;sv()">${PLAT.map(p=>`<option ${p===s.t?'selected':''}>${p}</option>`).join('')}</select><input placeholder="https://..." value="${esc(s.u)}" onchange="C.soc[${i}].u=this.value;sv()"><button onclick="C.soc.splice(${i},1);sv();renderAdm()">×</button></div>`).join('')+`<div class="row"><button class="btn" onclick="C.soc.push({t:'link',u:''});save();renderAdm()">+ Tambah link</button></div>`;
if(AT==='bk')h+=`<p class="sub">${hasWS?'Pengaturan disimpan di penyimpanan bersama.':'Pengaturan disimpan di browser ini. Ekspor backup secara berkala atau sebelum ganti perangkat.'}</p><div class="row"><button class="btn" onclick="expD()">Ekspor backup</button><label class="btn" style="margin:0">Impor<input type="file" accept="application/json" hidden onchange="impD(this.files[0])"></label></div>`;
$('#s-adm').innerHTML=h+`</div><div class="row"><button class="btn" onclick="admOut()">Keluar admin</button></div>`;if(AT==='srv')fit($('#sp'),C.slogan||' ')}
function expD(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(C,null,1)],{type:'application/json'}));a.download='oblivion-backup.json';a.click()}
async function impD(f){if(!f)return;try{C={...def,...JSON.parse(await f.text())};save();sv();renderAdm();toast('Backup dimuat')}catch(e){toast('File backup tidak valid')}}
function addV(){const p=+$('#vp').value;if(!(p>0))return toast('Isi persentase diskon');C.v.push({c:$('#vcode').value.trim().toUpperCase(),p,t:$('#vt').value,e:$('#ve').value});sv();renderAdm();toast('Voucher dibuat')}
function addM(){const n=$('#mn').value.trim();if(!n)return toast('Isi nickname');C.m.push({n,r:$('#mr').value.trim()||'Member',d:+$('#md2').value||0});sv();renderAdm();toast('Member disimpan')}

(async()=>{const c=await DB.get('cfg');if(c)C={...def,...c};const t=await DB.get('sess',false);if(t)PS=t;
navR();renderHome();renderStore();renderSocial();renderAdm()})();
</script>
</body>
